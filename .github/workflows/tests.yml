name: tests

on:
  push:
    # every branch; a tag-only push (ship, after the run) starts nothing
    branches: ['**']
  pull_request:

# a newer push to a branch cancels its stale run; a run on main always finishes
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # macOS: the system bash 3.2 at /bin/bash, not a newer one from Homebrew, runs the suite and every script it starts
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -n 1
          git --version
          command -v claude codex || echo "no claude or codex: those parts are skipped"
      - name: Run the suite
        run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # warnings and errors; the style notes are left to the author (settings: .shellcheckrc, tests/.shellcheckrc)
      - name: ShellCheck
        run: |
          shellcheck --version | head -n 2
          # every shell file under plugins/ and tests/ (not tests/fixtures, not node_modules): each *.sh file, and
          # each other file whose first line is a sh or bash shebang
          find plugins tests \( -path tests/fixtures -o -name node_modules \) -prune -o -type f -print \
            | while IFS= read -r f; do
                case "$f" in
                  *.sh) echo "$f" ;;
                  *) head -n 1 "$f" | grep -qE '^#!.*[/ ](ba)?sh( |$)' && echo "$f" ;;
                esac
              done | sort > "$RUNNER_TEMP/shell-files"
          cat "$RUNNER_TEMP/shell-files"
          tr '\n' '\0' < "$RUNNER_TEMP/shell-files" | xargs -0 shellcheck --severity=warning

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # no file arguments: actionlint finds every workflow in .github/workflows itself (*.yml and *.yaml)
          ./actionlint -color

name: tests

on:
  push:
    # every branch; a tag-only push (ship, after the run) starts nothing
    branches: ['**']
  pull_request:

# a newer push to a branch cancels its stale run; a run on main always finishes
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CLAUDE_VERSION: 2.1.319   # the claude CLI the suite runs with; bump on purpose
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@v4
      # before the macOS bash 3.2 step: the installer runs under the runner's own shell. Node is on both runners.
      - name: Install the claude CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
      # macOS: the system bash 3.2 at /bin/bash, not a newer one from Homebrew, runs the suite and every script it starts
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -n 1
          git --version
          command -v claude
          command -v codex || echo "no codex: those parts are skipped"
      - name: Run the suite
        # a SKIP for lack of claude is a failure here: the step above installed it
        shell: bash
        run: |
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/suite.out"
          if grep -F 'claude not on PATH' "$RUNNER_TEMP/suite.out"; then
            echo '::error::the claude CLI is installed, yet tests skipped for lack of it'; exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # warnings and errors; the style notes are left to the author (settings: .shellcheckrc, tests/.shellcheckrc)
      - name: ShellCheck
        run: |
          shellcheck --version | head -n 2
          # every shell file under plugins/, tests/ and scripts/ (not tests/fixtures, not node_modules): each *.sh file, and
          # each other file whose first line is a sh or bash shebang
          find plugins tests scripts \( -path tests/fixtures -o -name node_modules \) -prune -o -type f -print \
            | while IFS= read -r f; do
                case "$f" in
                  *.sh) echo "$f" ;;
                  *) head -n 1 "$f" | grep -qE '^#!.*[/ ](ba)?sh( |$)' && echo "$f" ;;
                esac
              done | sort > "$RUNNER_TEMP/shell-files"
          cat "$RUNNER_TEMP/shell-files"
          tr '\n' '\0' < "$RUNNER_TEMP/shell-files" | xargs -0 shellcheck --severity=warning

  # the subjects of the new commits only (CONTRIBUTING.md, Commits), never the old history: a PR checks
  # base..head; a push checks before..sha, or origin/<default>..sha when before is unknown (a new branch,
  # a force-push). Inputs reach the script through env, never as an expression inside run.
  commit-subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the new commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"
          fi
          echo "checking $range"; git log --oneline --no-merges "$range"
          bash scripts/commit-subjects.sh --range "$range"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # no file arguments: actionlint finds every workflow in .github/workflows itself (*.yml and *.yaml)
          ./actionlint -color

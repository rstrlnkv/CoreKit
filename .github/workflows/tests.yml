name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # macOS: the system bash 3.2 at /bin/bash, not a newer one from Homebrew, runs the suite and every script it starts
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -n 1
          git --version
          command -v claude codex || echo "no claude or codex: those parts are skipped"
      - name: Run the suite
        run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # warnings and errors; the style notes are left to the author (settings: .shellcheckrc, tests/.shellcheckrc)
      - name: ShellCheck
        run: |
          shellcheck --version | head -n 2
          # every *.sh file, and every file without an extension whose first line is a shell shebang
          find plugins/*/scripts plugins/*/hooks tests -path tests/fixtures -prune -o -type f -print \
            | while IFS= read -r f; do
                case "$f" in
                  *.sh) echo "$f" ;;
                  */*.*) ;;
                  *) head -n 1 "$f" | grep -q '^#!.*sh' && echo "$f" ;;
                esac
              done | sort > "$RUNNER_TEMP/shell-files"
          cat "$RUNNER_TEMP/shell-files"
          tr '\n' '\0' < "$RUNNER_TEMP/shell-files" | xargs -0 shellcheck --severity=warning

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
